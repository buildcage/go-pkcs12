name: Test

on:
  pull_request:
    branches: ["buildcage/**"]
  push:
    branches: ["buildcage/**"]

permissions:
  contents: read

jobs:
  test:
    name: "test (go ${{ matrix.go }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version buildcage-runc builds with, and the latest release.
        go: ["1.27", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
